<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دليل تصحيح التوقيت · تبيان</title>
  <meta name="description" content="كيف تصحح توقيت الآيات والكلمات في تلاوات تبيان بأذنك، خطوة خطوة.">
  <link rel="stylesheet" href="style.css">
  <style>
    .guide { max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
    .guide .back { display: inline-block; margin-bottom: 12px; }
    .guide h1 { font-size: 1.5rem; margin-top: 8px; }
    .guide h2 { font-size: 1.2rem; margin-top: 28px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
    .guide h3 { font-size: 1.05rem; margin-top: 22px; color: var(--accent); }
    .guide p, .guide li { font-size: 1rem; line-height: 1.9; }
    .guide aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--muted); }
    .guide figure { margin: 12px 0 18px; }
    .guide img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; display: block; }
    .guide figcaption { color: var(--muted); font-size: .85rem; margin-top: 4px; }
    .guide table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    .guide th, .guide td { border: 1px solid var(--line); padding: 6px 8px; text-align: start; }
    .guide code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; direction: ltr; unicode-bidi: isolate; }
    .guide section[lang=en] { margin-top: 40px; border-top: 2px solid var(--line); padding-top: 8px; }
    .guide a { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="guide">
    <a class="back button" href="./">→ العودة إلى المحرر · Back to the editor</a>
<!-- GUIDE -->
    <p><a class="button primary" href="./">افتح المحرر · Open the editor</a></p>
  </main>
</body>
</html>

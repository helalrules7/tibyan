name: tibyan
description: "Tibyan: a free, non-profit Quran app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.8.7+56
environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  sentry_flutter: ^9.30.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # Reviewed book packs are opened read-only, which drift cannot do
  # without stamping its schema version into the file.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
  # Drawing precompiled artwork, and the compiler that builds it off the main
  # isolate: parsing a page's SVG there stalled a page turn for hundreds of
  # milliseconds.
  vector_graphics: ^1.2.3
  vector_graphics_compiler: ^1.3.0
  archive: ^4.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  home_widget: ^0.10.0
  http: ^1.6.0
  crypto: ^3.0.7
  wakelock_plus: ^1.8.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  just_audio_background: ^0.0.1-beta.17
  background_downloader: ^9.6.3
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.1
  file_selector: ^1.1.0
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  app_links: ^7.2.1
  audio_service: ^0.18.18
  sherpa_onnx: ^1.13.8
  record: ^7.1.1
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  google_sign_in: ^7.2.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  msix: ^3.18.0

# Microsoft Store package (.github/workflows/msstore.yml, docs/RELEASE.md).
# Identity values come from Partner Center (Store ID 9N944SZ21PTS); the
# Store signs the package. msix_version is left out on purpose: msix derives
# a.b.c.0 from `version` above.
msix_config:
  display_name: تبيان - القرآن الكريم
  publisher_display_name: Ahmed Helal
  identity_name: AhmedHelal.-
  publisher: CN=A0A1785C-6EC9-4810-979B-4C815FFAF80A
  logo_path: windows/runner/resources/app_icon_square_1024.png
  languages: ar, en
  # microphone: tasmee and hifz voice recording work on Windows.
  capabilities: internetClient, microphone
  store: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  shaders:
    - shaders/page_curl.frag
    - shaders/page_curl_spread.frag
    - shaders/bead.frag

  assets:
    - assets/themes/
    - assets/reciters/
    - assets/config/
    - assets/content_db/
    - assets/ornaments/
    - assets/pages/hafs-1441/
    - assets/brand/
    - assets/tasbih/

  fonts:
    # Interface numbers outside the mushaf: digits and number signs cut from
    # IBM Plex Sans Arabic Bold, renamed ("Plex" is a Reserved Font Name). One
    # bold face only, so every number is bold. SIL OFL 1.1
    - family: TibyanNumerals
      fonts:
        - asset: assets/fonts/ofl/tibyannumerals/TibyanNumerals-Bold.ttf
          weight: 700
    # Interface digits (Western, Arabic-Indic, Persian), named ahead of
    # Changa (its ٢ and ٣ read alike): a digits-only subset of IBM Plex Sans Arabic, renamed
    # ("Plex" is a Reserved Font Name). SIL OFL 1.1
    - family: TibyanDigits
      fonts:
        - asset: assets/fonts/ofl/tibyandigits/TibyanDigits-Regular.ttf
          weight: 400
        - asset: assets/fonts/ofl/tibyandigits/TibyanDigits-Medium.ttf
          weight: 500
        - asset: assets/fonts/ofl/tibyandigits/TibyanDigits-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ofl/tibyandigits/TibyanDigits-Bold.ttf
          weight: 700
    # Interface (Arabic). SIL OFL 1.1
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ofl/ibmplexsansarabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ofl/ibmplexsansarabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ofl/ibmplexsansarabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ofl/ibmplexsansarabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
    # Interface (Latin, and fallback for Latin inside Arabic text). SIL OFL 1.1
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/ofl/ibmplexsans/IBMPlexSans[wdth,wght].ttf
    # Interface (Arabic), alternative chosen in settings. KFGQPC, shipped unmodified
    - family: KFGQPCAN
      fonts:
        - asset: assets/fonts/kfgqpc/KFGQPCAnLight.ttf
          weight: 300
        - asset: assets/fonts/kfgqpc/KFGQPCAnRegular.ttf
          weight: 400
        - asset: assets/fonts/kfgqpc/KFGQPCAnBold.ttf
          weight: 700
        - asset: assets/fonts/kfgqpc/KFGQPCAnExtra.ttf
          weight: 800
    # Interface (Arabic and Latin), alternative chosen in settings. SIL OFL 1.1
    - family: Changa
      fonts:
        - asset: assets/fonts/ofl/changa/Changa[wght].ttf
    # Logo. SIL OFL 1.1
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ofl/arefruqaa/ArefRuqaa-Bold.ttf
          weight: 700
    # Quran text in the continuous view (Tanzil Uthmani encoding). SIL OFL 1.1
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/ofl/amiriquran/AmiriQuran-Regular.ttf
    # Quran text in the continuous view (KFGQPC Hafs v2.0 text encoding).
    # KFGQPC, shipped unmodified
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/kfgqpc/uthmanic_hafs_v20.ttf
    # Surah headers per style. KFGQPC, shipped unmodified
    - family: UthmanTahaNaskh
      fonts:
        - asset: assets/fonts/kfgqpc/UthmanTN_v2-0.ttf
    - family: KFGQPCKufiExtended
      fonts:
        - asset: assets/fonts/kfgqpc/KFGQPC-KufiExtV14.ttf
    # Surah names in the index and on home (one glyph per surah from
    # U+F100). KFGQPC, shipped unmodified
    - family: QCF4_QBSML
      fonts:
        - asset: assets/fonts/kfgqpc/QCF4_QBSML.ttf

# Media browsing (Android Auto) needs a hook the package does not offer:
# packages/just_audio_background/TIBYAN.md.
dependency_overrides:
  just_audio_background:
    path: packages/just_audio_background

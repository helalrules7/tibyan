<!doctype html>
{% set ar = lang == 'ar' %}
{% set url = 'https://altibyan.app' ~ prefix ~ page_path %}
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | {{ 'تبيان' if ar else 'Tibyan' }}</title>
  <meta name="description" content="{% block desc %}{% endblock %}">
  <link rel="canonical" href="{{ url }}">
  <link rel="alternate" hreflang="ar" href="https://altibyan.app{{ page_path }}">
  <link rel="alternate" hreflang="en" href="https://altibyan.app/en{{ page_path }}">
  <link rel="alternate" hreflang="x-default" href="https://altibyan.app{{ page_path }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="تبيان">
  <meta property="og:title" content="{{ self.title() }} | {{ 'تبيان' if ar else 'Tibyan' }}">
  <meta property="og:description" content="{{ self.desc() }}">
  <meta property="og:url" content="{{ url }}">
  <meta property="og:image" content="https://altibyan.app/static/coming-soon-share.png?v=3">
  <meta name="twitter:card" content="summary_large_image">
  {% include "_site_head.html" %}
  <link rel="stylesheet" href="/static/pages.css?v={{ asset_v }}">
</head>
<body class="x x-inner">
{% include "_site_header.html" %}
  <main class="x-wrap x-doc">
{% block content %}{% endblock %}

  </main>
  <div class="x-wrap">
{% include "_launch_footer.html" %}
  </div>
</body>
</html>

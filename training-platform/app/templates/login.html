{% extends "base.html" %}
{% block title %}{{ t('login_title') }} · {{ t('app_name') }}{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>{{ t('login_title') }}</h1>

  {% if errors %}
    <div class="errors"><ul>
      {% for m in errors %}<li>{{ m }}</li>{% endfor %}
    </ul></div>
  {% endif %}

  <form method="post" action="/login" novalidate>
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <label>
      <span>{{ t('identifier') }}</span>
      <input type="text" name="identifier" value="{{ identifier }}" required
             autocomplete="username" autocapitalize="none" autocorrect="off"
             spellcheck="false" dir="auto">
      <small>{{ t('login_identifier_hint') }}</small>
    </label>

    <label>
      <span>{{ t('password') }}</span>
      <input type="password" name="password" required autocomplete="current-password"
             autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>

    <button class="btn primary" type="submit">{{ t('submit_login') }}</button>
  </form>

  <p class="muted">{{ t('no_account') }} <a href="/register">{{ t('nav_register') }}</a></p>
</section>
{% endblock %}

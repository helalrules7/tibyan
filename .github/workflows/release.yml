name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: The tag matches pubspec.yaml
        run: python3 tools/release/check_version.py "$GITHUB_REF_NAME"
      # With the keystore secrets (docs/RELEASE.md) the build is signed with
      # the upload key; without them it falls back to the debug key, fine for
      # testing and not for the Play Store.
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
          else
            echo "No keystore secret: signing with the debug key."
          fi
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      # Internal testing track on Google Play, when the service account is
      # set (docs/RELEASE.md); otherwise nothing is uploaded.
      - name: Google Play internal track
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_KEY" ]; then
            echo "$PLAY_KEY" > "$RUNNER_TEMP/play.json"
            python3 tools/play_upload.py build/app/outputs/bundle/release/app-release.aab \
              --key "$RUNNER_TEMP/play.json" --name "${GITHUB_REF_NAME#v}"
          else
            echo "No Play service account secret: not uploaded."
          fi
      - run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/
          cp build/app/outputs/bundle/release/app-release.aab out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-android
          path: out/

  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # Unsigned: it is signed and uploaded from Xcode or Transporter with
      # the team's certificate (docs/RELEASE.md).
      - name: Zip the unsigned app
        run: |
          cd build/ios/iphoneos
          zip -qry ../../../tibyan-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-ios
          path: tibyan-ios-unsigned.zip

  macos:
    name: macOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip and disk image of the app
        run: |
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --keepParent "$app" tibyan-macos-unsigned.zip
          hdiutil create -volname Tibyan -srcfolder "$app" -ov -format UDZO tibyan-macos-unsigned.dmg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-macos
          path: |
            tibyan-macos-unsigned.zip
            tibyan-macos-unsigned.dmg

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Build tools (GTK, libmpv, libcurl)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev mpv libsecret-1-dev libjsoncpp-dev \
            libcurl4-openssl-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      # Needs libmpv on the reader's system (for the recitation):
      # apt install libmpv2, or the distribution's mpv package.
      - name: Archive the bundle
        run: tar -C build/linux/x64/release/bundle -czf tibyan-linux-x64.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-linux
          path: tibyan-linux-x64.tar.gz

  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tibyan-windows-x64.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tibyan-windows
          path: tibyan-windows-x64.zip

  publish:
    name: GitHub release
    needs: [android, ios, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          body_path: notes.md
          files: |
            app-release.apk
            app-release.aab
            tibyan-ios-unsigned.zip
            tibyan-macos-unsigned.zip
            tibyan-macos-unsigned.dmg
            tibyan-linux-x64.tar.gz
            tibyan-windows-x64.zip

name: Timing measure

# Measures recitation timings by forced alignment on the surah files the app
# plays (tools/measure_timing.py with tools/build_aligned_timing.py), for the
# gaps in docs/MISSING_DATA.md (ث2, ث4, ث5-ج, ث10, ث12, ث13). Started by hand
# only. It never pushes, deploys or comments: the result is an artifact
# (timing files, audio.json, reciters.json with the credit, peaks, a report)
# to review in the timing editor and merge by a pull request. See
# docs/TIMING.md, "Measuring timings".

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'Recitation slug from data/timing/reciters.json (e.g. warsh-abdulbasit-106, mustafa-ismail, sudais, muaiqly)'
        required: true
        type: string
      surahs:
        description: 'What to measure. mode surahs: all | missing | 1,9,21-23. mode verses: flagged | known | 2:181,6:99'
        required: true
        default: missing
        type: string
      mode:
        description: 'surahs: whole surahs (verses, and words in Hafs). verses: the words of single verses, in their windows'
        required: true
        default: surahs
        type: choice
        options: [surahs, verses]
      shards:
        description: 'Parallel jobs (each may run 6 hours; a whole recitation takes several)'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: timing-measure-${{ inputs.reciter }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  # build_aligned_timing.MODEL_REVISION; the cache is keyed on it
  MODEL_REVISION: af46c2d8531b8dcbb5e23b952f739b372c2e5d2d
  PIP_DEPS: numpy==1.26.4 transformers==4.46.3
  TORCH_DEPS: torch==2.5.1 torchaudio==2.5.1

jobs:
  plan:
    name: Plan the shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true  # content.db: the verse windows of an unpublished reciter
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Plan
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          RECITER: ${{ inputs.reciter }}
          SPEC: ${{ inputs.surahs }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy==1.26.4
          shards=$(python tools/measure_timing.py plan "$MODE" "$RECITER" "$SPEC" --shards "$SHARDS")
          echo "$shards"
          [[ "$shards" != "[]" ]] || { echo "nothing to measure"; exit 1; }
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  model:
    name: Fetch the model once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools/.cache/wav2vec2-large-xlsr-53-arabic
          key: wav2vec2-large-xlsr-53-arabic-${{ env.MODEL_REVISION }}
      - name: Fetch and check (Hugging Face at the pinned revision, else Tibyan's mirror)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet numpy==1.26.4
          python tools/measure_timing.py fetch-model

  measure:
    name: Measure ${{ matrix.spec }}
    needs: [plan, model]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        spec: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true  # content.db: the Hafs words of our word boxes (read only)
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tools/.cache/wav2vec2-large-xlsr-53-arabic
          key: wav2vec2-large-xlsr-53-arabic-${{ env.MODEL_REVISION }}
          fail-on-cache-miss: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/pip
          key: pip-timing-measure-${{ hashFiles('.github/workflows/timing-measure.yml') }}
      - name: Install ffmpeg and the Python dependencies (CPU torch)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet $TORCH_DEPS --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet $PIP_DEPS
      - name: Measure
        env:
          MODE: ${{ inputs.mode }}
          RECITER: ${{ inputs.reciter }}
          SPEC: ${{ matrix.spec }}
        run: python tools/measure_timing.py run "$MODE" "$RECITER" "$SPEC" --out "$RUNNER_TEMP/shard"
      - name: Name the shard
        id: name
        env:
          SPEC: ${{ matrix.spec }}
        run: echo "name=shard-$(echo -n "$SPEC" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/shard
          retention-days: 7

  finish:
    name: Assemble, check and report
    needs: [plan, measure]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - name: Assemble and check
        env:
          MODE: ${{ inputs.mode }}
          RECITER: ${{ inputs.reciter }}
        run: |
          set -uo pipefail
          python -m pip install --quiet numpy==1.26.4
          python tools/measure_timing.py finish "$MODE" "$RECITER" "$RUNNER_TEMP"/shards/shard-* --out "$RUNNER_TEMP/out"
          status=$?
          cat "$RUNNER_TEMP/out/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Name the result
        if: always()
        id: name
        env:
          MODE: ${{ inputs.mode }}
          RECITER: ${{ inputs.reciter }}
        run: echo "name=timing-$(echo -n "$RECITER" | tr -c 'a-z0-9-' '-')-$MODE-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/out
          retention-days: 30
